# 通道探针协议（仅用于实验，不是正式协议）
# 数据划分 / 窗口 / 预处理 与 main_70_15_15_v2 完全一致，只改使用哪些原始通道
name: probe_channels_7
version: probe
status: probe
dataset_cache_id: chprobe_c0_0123456

paths:
  raw_root: data/seu
  artifact_root: artifacts
  sealed_test_root: artifacts/sealed_test

dataset:
  name: seu_dds
  tasks: [gear, bearing]
  conditions: [20_0, 30_2]
  num_classes: 5
  file_length: 1048560
  channel_indices: [0, 1, 2, 3, 4, 5, 6]

split:
  kind: time_contiguous
  shuffle: false
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

window:
  length: 1600
  stride: 800
  overlap: 0.5

preprocessing:
  normalize: per_window_per_channel_zscore
  bins: 6
  bin_edges: equal_frequency_quantile
  bin_scope: fit_on_train_only

representation:
  channels: [torque, planet_x, planet_y, planet_z, parallel_x, parallel_y, parallel_z]
  lags: [1, 2, 3, 4, 5, 6, 7]
  transition: joint_probability
  transition_weight: probability
  transition_multichannel: stack
  include_self_transition: true

models:
  cnn:
    conv_channels: [32, 64]
    kernel_size: 3
    pool_size: 2
    fc_hidden: []
  gcn:
    layers: 2
    hidden: 32
    layout: relational
    gcn_steps: 3
    gcn_pool: flat
    gcn_attention: false

training:
  optimizer: adam
  lr: 0.0005
  weight_decay: 0.0001
  dropout: 0.2
  batch_size: 32
  epochs: 200
  early_stop_patience: 30
  monitor: val_accuracy
  stop_on: val_acc
  deterministic: true
  num_workers: 0
  seeds: [42]
  lr_scheduler:
    name: reduce_on_plateau
    monitor: val_loss
    mode: min
    factor: 0.5
    patience: 8
    min_lr: 1.0e-6

evaluation:
  metrics: [accuracy, macro_f1, balanced_accuracy]
  test_access: sealed_once
