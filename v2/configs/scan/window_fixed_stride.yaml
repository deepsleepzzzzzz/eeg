# 窗长消融（方案 A）：步长固定 1024，让窗数基本不变
# 目的：把"窗长"变成接近受控的变量（窗数一致 -> 验证集分辨率一致 -> 可直接比）
# 与现状的区别：现状的步长 = 窗长/2，所以改窗长会同时改窗数
variants:
  base:          {}                                    # 2048 / 1024（现状）
  win1600_s1024: {window.length: 1600, window.stride: 1024}   # 重叠 36%
  win3200_s1024: {window.length: 3200, window.stride: 1024}   # 重叠 68%
