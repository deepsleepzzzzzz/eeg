# 幅值补充：把等频符号化抹掉的能量信息加回来（回答"齿轮两类为什么重叠"）
#
# 动机：等频分位符号化保证每档样本数相等，保住"状态转移结构"，却抹平了"幅值/能量"。
#       齿轮任务里"缺齿 ↔ 齿面磨损"因此重叠：类心距 5.5，而类内散布 14.8。
# 做法：每通道追加一个 6x6 区块（与转移矩阵同形，CNN/GCN 结构不变），输入通道 30 -> 33。
#   rms3  : 每通道一个 log10(RMS) 填满该区块（只补"整窗能量"）
#   state3: 每通道按状态给出 log10(状态内均方) 放对角线并按通道中心化（补"状态剖面"）
#
# 跑在齿轮两个工况上（重叠正是发生在齿轮），与主协议同划分/同窗/同训练预算。
variants:
  rms3:   {representation.energy_stats: rms}
  state3: {representation.energy_stats: state}

# 注意（2026-10-16）：本消融**只在 CNN 上做**。
# 理由：energy_stats 把输入通道从 30 增加到 33，而 GCN 的 relational 布局要求
#       num_graphs == 通道数 × 滞后数（3×10=30）——额外的 3 个能量区块没有对应的
#       "关系类型"，GCN 侧会直接报错。要让 GCN 支持，需要改 GCN 的布局语义，属于另一件事。
